[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loan_analyzer"
version = "0.1.0"
authors = [
  { name="Zaki", email="zaki@example.com" },
]
description = "A comprehensive loan data validation and metrics engine using DuckDB."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "duckdb>=1.0.0",
    "pandas",
]

[tool.setuptools.package-data]
loan_analyzer = ["sql/*.sql", "tests/*.sql"]
